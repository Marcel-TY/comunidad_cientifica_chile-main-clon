<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" fill="none">
  <defs>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7c5cfc" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#7c5cfc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00c9ff" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#00c9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#9d83fd"/>
      <stop offset="100%" stop-color="#00c9ff"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7c5cfc"/>
      <stop offset="100%" stop-color="#5b3de8"/>
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00e5a0"/>
      <stop offset="100%" stop-color="#00c9ff"/>
    </linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <!-- Background glow blobs -->
  <ellipse cx="260" cy="240" rx="200" ry="180" fill="url(#glow1)" filter="url(#blur1)"/>
  <ellipse cx="380" cy="120" rx="120" ry="100" fill="url(#glow2)" filter="url(#blur1)"/>

  <!-- Orbit rings (atom) -->
  <ellipse cx="260" cy="240" rx="180" ry="60"  stroke="#7c5cfc" stroke-width="1.2" stroke-dasharray="6 4" opacity=".45" transform="rotate(-20 260 240)"/>
  <ellipse cx="260" cy="240" rx="180" ry="60"  stroke="#00c9ff" stroke-width="1.2" stroke-dasharray="6 4" opacity=".38" transform="rotate(40 260 240)"/>
  <ellipse cx="260" cy="240" rx="180" ry="60"  stroke="#9d83fd" stroke-width="1"   stroke-dasharray="4 6" opacity=".3"  transform="rotate(100 260 240)"/>

  <!-- Central nucleus -->
  <circle cx="260" cy="240" r="22" fill="url(#grad2)" opacity=".9"/>
  <circle cx="260" cy="240" r="14" fill="url(#grad1)"/>
  <circle cx="260" cy="240" r="5"  fill="white" opacity=".9"/>

  <!-- Electron dots on orbits -->
  <circle cx="440" cy="230" r="7"  fill="url(#grad1)" filter="url(#blur2)" opacity=".9"/>
  <circle cx="100" cy="220" r="5"  fill="#00c9ff"      opacity=".8"/>
  <circle cx="310" cy="90"  r="6"  fill="url(#grad3)"  opacity=".85"/>
  <circle cx="200" cy="390" r="5"  fill="#9d83fd"       opacity=".75"/>
  <circle cx="380" cy="350" r="6"  fill="#00c9ff"       opacity=".7"/>

  <!-- Panel cards (floating UI) -->
  <!-- Card 1 - top right -->
  <rect x="340" y="50" width="150" height="80" rx="14" fill="rgba(255,255,255,.07)" stroke="rgba(255,255,255,.14)" stroke-width="1"/>
  <rect x="356" y="68" width="60" height="8"  rx="4" fill="url(#grad1)" opacity=".8"/>
  <rect x="356" y="82" width="90" height="6"  rx="3" fill="rgba(255,255,255,.25)"/>
  <rect x="356" y="94" width="75" height="6"  rx="3" fill="rgba(255,255,255,.18)"/>
  <circle cx="462" cy="76" r="12" fill="url(#grad3)" opacity=".85"/>
  <text x="456" y="81" font-size="11" fill="white" font-family="sans-serif" font-weight="700">✓</text>

  <!-- Card 2 - bottom left -->
  <rect x="30" y="300" width="160" height="90" rx="14" fill="rgba(255,255,255,.07)" stroke="rgba(255,255,255,.14)" stroke-width="1"/>
  <rect x="46" y="318" width="50" height="7"  rx="3" fill="url(#grad1)" opacity=".75"/>
  <rect x="46" y="331" width="128" height="5" rx="2.5" fill="rgba(255,255,255,.2)"/>
  <rect x="46" y="342" width="100" height="5" rx="2.5" fill="rgba(255,255,255,.15)"/>
  <rect x="46" y="363" width="60" height="18" rx="8" fill="url(#grad2)"/>
  <text x="55" y="376" font-size="9" fill="white" font-family="sans-serif" font-weight="600">Postular</text>

  <!-- Card 3 - center right -->
  <rect x="370" y="290" width="130" height="75" rx="12" fill="rgba(255,255,255,.065)" stroke="rgba(255,255,255,.13)" stroke-width="1"/>
  <rect x="382" y="306" width="70"  height="7"  rx="3.5" fill="#00c9ff" opacity=".7"/>
  <rect x="382" y="319" width="106" height="5"  rx="2.5" fill="rgba(255,255,255,.2)"/>
  <rect x="382" y="330" width="88"  height="5"  rx="2.5" fill="rgba(255,255,255,.14)"/>
  <!-- Mini chart bars -->
  <rect x="382" y="344" width="12" height="10" rx="3" fill="#00e5a0" opacity=".8"/>
  <rect x="397" y="339" width="12" height="15" rx="3" fill="url(#grad1)" opacity=".8"/>
  <rect x="412" y="336" width="12" height="18" rx="3" fill="#7c5cfc" opacity=".8"/>
  <rect x="427" y="341" width="12" height="13" rx="3" fill="#00c9ff" opacity=".8"/>
  <rect x="442" y="334" width="12" height="20" rx="3" fill="url(#grad3)" opacity=".8"/>

  <!-- Floating particles -->
  <circle cx="150" cy="100" r="3" fill="#9d83fd" opacity=".6"/>
  <circle cx="430" cy="180" r="2.5" fill="#00c9ff" opacity=".5"/>
  <circle cx="70"  cy="200" r="2"   fill="#00e5a0" opacity=".55"/>
  <circle cx="490" cy="380" r="3"   fill="#7c5cfc" opacity=".5"/>
  <circle cx="300" cy="440" r="2.5" fill="#9d83fd" opacity=".45"/>
  <circle cx="180" cy="170" r="2"   fill="#00c9ff" opacity=".6"/>
  <circle cx="460" cy="140" r="2"   fill="#00e5a0" opacity=".5"/>

  <!-- Connection lines (network) -->
  <line x1="260" y1="240" x2="440" y2="230" stroke="#7c5cfc" stroke-width=".8" stroke-dasharray="4 4" opacity=".3"/>
  <line x1="260" y1="240" x2="100" y2="220" stroke="#00c9ff" stroke-width=".8" stroke-dasharray="4 4" opacity=".25"/>
  <line x1="260" y1="240" x2="310" y2="90"  stroke="#9d83fd" stroke-width=".8" stroke-dasharray="4 4" opacity=".28"/>

  <!-- Stats pill at bottom -->
  <rect x="160" y="420" width="200" height="40" rx="20" fill="rgba(124,92,252,.18)" stroke="rgba(124,92,252,.35)" stroke-width="1"/>
  <circle cx="185" cy="440" r="10" fill="url(#grad3)"/>
  <text x="180" y="444" font-size="9" fill="white" font-family="sans-serif" font-weight="700">✓</text>
  <text x="202" y="443" font-size="10.5" fill="#eef0ff" font-family="sans-serif" font-weight="600">Plataforma activa · 2026</text>
</svg>