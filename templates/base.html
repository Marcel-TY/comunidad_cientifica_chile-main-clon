{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#8f63ff">
  <meta name="description" content="Comunidad Científica Chile — Portal profesional de empleos, eventos, blog, turismo científico, publicidad e inteligencia artificial para investigadores y académicos.">
  <meta name="keywords" content="ciencia, investigación, empleos académicos, eventos científicos, Chile, innovación, divulgación">
  <meta name="author" content="Comunidad Científica Chile">

  <!-- Open Graph -->
  <meta property="og:title" content="Comunidad Científica Chile">
  <meta property="og:description" content="Portal profesional para investigadores: empleos, eventos, blog, turismo científico e IA.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{% static 'icons/icon-512.svg' %}">
  <meta name="twitter:card" content="summary_large_image">

  <title>{% block page_title %}Comunidad Científica Chile{% endblock %}</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="{% static 'icons/icon-192.svg' %}">
  <link rel="apple-touch-icon" href="{% static 'icons/icon-192.svg' %}">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    (function () {
      const savedTheme = localStorage.getItem('theme');
      document.documentElement.setAttribute('data-theme', savedTheme === 'light' ? 'light' : 'dark');
    })();
  </script>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}

  <!-- PWA Install Button -->
  <button id="installAppBtn" class="install-app-btn" type="button" aria-label="Instalar aplicación como app" hidden>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3m0 12l-4-4m4 4l4-4"/><path d="M2 17l.621 2.485A2 2 0 004.561 21h14.878a2 2 0 001.94-1.515L22 17"/></svg>
    Instalar App
  </button>

  <!-- Day/Night Theme Toggle -->
  <button id="themeToggleBtn" class="theme-toggle" type="button" title="Cambiar tema" aria-label="Cambiar modo de color">
    <span class="theme-toggle-icon" aria-hidden="true"></span>
    <span class="theme-toggle-label"></span>
  </button>

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"WebSite","name":"Comunidad Científica Chile","url":"https://comunidadcientifica.cl","description":"Portal profesional para investigadores, académicos e instituciones de Chile: empleos, eventos, blog científico, turismo e inteligencia artificial.","potentialAction":{"@type":"SearchAction","target":{"@type":"EntryPoint","urlTemplate":"https://comunidadcientifica.cl/buscar/?q={search_term_string}"},"query-input":"required name=search_term_string"}}
  </script>

  <script>
    // ── Service Worker ─────────────────────────────────────
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/service-worker.js').catch(function(){});
      });
    }

    // ── PWA Install Prompt ─────────────────────────────────
    let deferredPrompt = null;
    const installBtn = document.getElementById('installAppBtn');
    const installedKey = 'pwa-installed';
    const installStartKey = 'pwa-install-started-at';
    const installExpiredKey = 'pwa-install-expired';
    const launchedAsApp = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    const alreadyInstalled = localStorage.getItem(installedKey) === 'true' || launchedAsApp;
    let installDeadline = Number(sessionStorage.getItem(installStartKey));

    if (launchedAsApp) localStorage.setItem(installedKey, 'true');
    if (!installDeadline) {
      installDeadline = Date.now() + 15000;
      sessionStorage.setItem(installStartKey, String(installDeadline));
    }

    let installPromptExpired = alreadyInstalled || sessionStorage.getItem(installExpiredKey) === 'true' || Date.now() >= installDeadline;
    function hideInstallButton() {
      installBtn.hidden = true;
      deferredPrompt = null;
    }

    if (installPromptExpired) {
      sessionStorage.setItem(installExpiredKey, 'true');
      hideInstallButton();
    } else {
      window.setTimeout(function () {
        installPromptExpired = true;
        sessionStorage.setItem(installExpiredKey, 'true');
        hideInstallButton();
      }, installDeadline - Date.now());
    }

    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      if (installPromptExpired || alreadyInstalled) return;
      deferredPrompt = e;
      installBtn.hidden = false;
    });
    installBtn.addEventListener('click', async function () {
      if (!deferredPrompt) return;
      const prompt = deferredPrompt;
      deferredPrompt = null;
      installBtn.hidden = true;
      await prompt.prompt();
      const choice = await prompt.userChoice;
      if (choice.outcome === 'accepted') localStorage.setItem(installedKey, 'true');
    });
    window.addEventListener('appinstalled', function () {
      localStorage.setItem(installedKey, 'true');
      installPromptExpired = true;
      sessionStorage.setItem(installExpiredKey, 'true');
      hideInstallButton();
    });
    window.addEventListener('storage', function (event) {
      if (event.key === installedKey && event.newValue === 'true') hideInstallButton();
    });

    // ── Mobile Nav Toggle ──────────────────────────────────
    document.addEventListener('DOMContentLoaded', function () {
      const toggle = document.getElementById('navToggle');
      const links  = document.getElementById('navLinks');
      if (toggle && links) {
        toggle.addEventListener('click', function () {
          const isOpen = links.classList.toggle('nav-open');
          toggle.setAttribute('aria-expanded', isOpen);
        });
        links.querySelectorAll('a').forEach(function(a){
          a.addEventListener('click', function(){
            links.classList.remove('nav-open');
            toggle.setAttribute('aria-expanded','false');
          });
        });
      }

      // ── Dark / Light Theme Toggle (Rec #1) ──────────────
      const themBtn = document.getElementById('themeToggleBtn');
      const root    = document.documentElement;
      const saved   = root.getAttribute('data-theme') || 'dark';
      root.setAttribute('data-theme', saved);
      updateThemeIcon(saved);

      if (themBtn) {
        themBtn.addEventListener('click', function () {
          const current = root.getAttribute('data-theme');
          const next    = current === 'dark' ? 'light' : 'dark';
          root.setAttribute('data-theme', next);
          localStorage.setItem('theme', next);
          updateThemeIcon(next);
        });
      }
      window.addEventListener('storage', function (event) {
        if (event.key !== 'theme' || !['dark', 'light'].includes(event.newValue)) return;
        root.setAttribute('data-theme', event.newValue);
        updateThemeIcon(event.newValue);
      });
      function updateThemeIcon(t) {
        if (!themBtn) return;
        const icon = t === 'dark'
          ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>'
          : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1111.21 3a7 7 0 109.79 9.79z"/></svg>';
        themBtn.querySelector('.theme-toggle-icon').innerHTML = icon;
        themBtn.querySelector('.theme-toggle-label').textContent = t === 'dark' ? 'Día' : 'Noche';
        themBtn.title = t === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro';
        themBtn.setAttribute('aria-label', themBtn.title);
      }

      // ── Scroll Reveal (Rec #2 / #3) ───────────────────────
      if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add('visible');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.12 });
        document.querySelectorAll('.reveal').forEach(function(el) {
          observer.observe(el);
        });
      } else {
        // Fallback: show all immediately
        document.querySelectorAll('.reveal').forEach(function(el) {
          el.classList.add('visible');
        });
      }

      // ── Share API helper (Rec #10) ─────────────────────────
      document.querySelectorAll('[data-share]').forEach(function(btn) {
        btn.addEventListener('click', async function() {
          const url   = btn.dataset.shareUrl   || window.location.href;
          const title = btn.dataset.shareTitle || document.title;
          if (navigator.share) {
            try { await navigator.share({ title: title, url: url }); } catch(e) {}
          } else {
            // Fallback: copy to clipboard
            try {
              await navigator.clipboard.writeText(url);
              const orig = btn.textContent;
              btn.textContent = '¡Copiado!';
              setTimeout(function(){ btn.innerHTML = orig; }, 2000);
            } catch(e) {}
          }
        });
      });

      // ── Favorite Toggle (Rec #9) ───────────────────────────
      document.querySelectorAll('.fav-btn[data-item-type]').forEach(function(btn) {
        btn.addEventListener('click', async function() {
          const data = { item_type: btn.dataset.itemType, item_id: btn.dataset.itemId };
          try {
            const resp = await fetch('/api/favoritos/', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
              body: JSON.stringify(data)
            });
            if (resp.ok) {
              const json = await resp.json();
              btn.classList.toggle('is-fav', json.action === 'added');
              btn.querySelector('.fav-label').textContent = json.action === 'added' ? 'Guardado' : 'Guardar';
            }
          } catch(e) {}
        });
      });

      function getCookie(name) {
        const m = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
        return m ? decodeURIComponent(m[2]) : '';
      }
    });
  </script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
