{% extends 'sections/base_section.html' %}

{% block section_content %}
<section class="section">
  <div class="form-wrap glass">
    <h2>Publicar aviso</h2>
    <p class="form-subtitle">Tu publicación quedará visible para la comunidad.</p>

    <form method="post" class="form-grid">
      {% csrf_token %}
      {% for field in form %}
        <div class="form-group">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            <p class="form-error">{{ field.errors|striptags }}</p>
          {% endif %}
        </div>
      {% endfor %}

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Publicar aviso</button>
        <a href="{% url 'biblioteca' %}" class="btn btn-ghost">Cancelar</a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
