databases:
  - name: comunidad-cientifica-db
    region: oregon
    plan: basic-256mb
    databaseName: comunidad_cientifica
    user: comunidad_cientifica

services:
  - type: web
    name: comunidad-cientifica
    runtime: python
    region: oregon
    plan: 0.5c-512mb
    branch: main
    buildCommand: bash build.sh
    preDeployCommand: cd comunidad_cientifica && python manage.py migrate --noinput
    startCommand: cd comunidad_cientifica && gunicorn comunidad_cientifica.wsgi:application
    healthCheckPath: /api/research/session/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: comunidad-cientifica-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: 2
