# .github/workflows/ci.yml
# CI/CD — Comunidad Científica Chile
# Runs on every push/PR to main or develop:
#   1. Build the Angular frontend
#   2. Lint (flake8), check Django and apply PostgreSQL migrations
#   3. Run the test suite with coverage
# ──────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Python ${{ matrix.python-version }} / Django tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    defaults:
      run:
        working-directory: comunidad_cientifica   # manage.py lives here

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: comunidad_cientifica
          POSTGRES_USER: comunidad_cientifica
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comunidad_cientifica -d comunidad_cientifica"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: "ci-insecure-key-do-not-use-in-production"
      DJANGO_DEBUG:       "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      PYTHONDONTWRITEBYTECODE: "1"
      POSTGRES_DB: comunidad_cientifica
      POSTGRES_USER: comunidad_cientifica
      POSTGRES_PASSWORD: ci-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      # ── 1. Checkout ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Build Angular ─────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix ../frontend

      - name: Build Angular frontend
        run: npm run build --prefix ../frontend

      # ── 3. Set up Python ─────────────────────────────────────
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # ── 4. Install dependencies ───────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt
          pip install flake8 coverage

      # ── 5. Lint ───────────────────────────────────────────────
      - name: Lint with flake8
        run: |
          flake8 . \
            --max-line-length=120 \
            --exclude=migrations,__pycache__,.git,venv \
            --count --statistics

      # ── 6. Django system check ────────────────────────────────
      - name: Django system check
        run: python manage.py check

      # ── 7. Run migrations ─────────────────────────────────────
      - name: Run migrations
        run: python manage.py migrate --noinput

      # ── 8. Run tests with coverage ────────────────────────────
      - name: Test with coverage
        run: |
          coverage run --source=accounts,research,comunidad_cientifica manage.py test accounts research --verbosity=2
          coverage report -m --fail-under=60

      # ── 9. Upload coverage report (optional) ─────────────────
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: comunidad_cientifica/.coverage
          retention-days: 7
